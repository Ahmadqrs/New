workflows:
  android-workflow:
    name: Tosheh Akherat Android
    max_build_duration: 60

    environment:
      flutter: stable

    scripts:
      - name: Ensure Android platform files
        script: |
          flutter create --platforms=android --org com.quraishe .

      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Build APK
        script: |
          flutter build apk --release

    artifacts:
      - build/**/outputs/**/*.apk
